# PHP2Shell Lab — Remote Testing
#
# Two profiles:
#   1. lab       — display_errors=On, 8M (8M chain test)
#   2. production — display_errors=Off, 128M (production chain test)
#
# Usage:
#   docker compose up -d                    # default: lab profile
#   docker compose -f docker-compose.yml up -d production
#
# Remote access: port 8088 is bound to 0.0.0.0 (all interfaces)
#   http://YOUR_IP:8088/

services:
  lab:
    image: php:8.4.26-apache
    platform: linux/amd64
    container_name: php2shell-lab
    ports:
      - "0.0.0.0:8088:80"
    volumes:
      - ./php.ini:/usr/local/etc/php/conf.d/zz-php2shell.ini:ro
      - ./apache.conf:/etc/apache2/conf-enabled/zz-php2shell.conf:ro
      - ./www:/var/www/html:ro
      - ./out:/out
    command:
      - /bin/sh
      - -c
      - chown -R www-data:www-data /out 2>/dev/null || true; exec apache2-foreground
    restart: unless-stopped
    profiles: ["", "lab"]

  production:
    image: php:8.4.26-apache
    platform: linux/amd64
    container_name: php2shell-prod
    ports:
      - "0.0.0.0:8089:80"
    volumes:
      - ./php-production.ini:/usr/local/etc/php/conf.d/zz-php2shell.ini:ro
      - ./apache-prod.conf:/etc/apache2/conf-enabled/zz-php2shell.conf:ro
      - ./www:/var/www/html:ro
      - ./out:/out
    command:
      - /bin/sh
      - -c
      - chown -R www-data:www-data /out 2>/dev/null || true; exec apache2-foreground
    restart: unless-stopped
    profiles: ["production"]
